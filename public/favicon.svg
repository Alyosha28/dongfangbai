    }
  </style>
  <rect class="bg" width="32" height="32" rx="6" />
  <rect class="frame" x="2" y="2" width="28" height="28" rx="4.5" fill="none" stroke-width="1.4" />
  <text class="glyph" x="16" y="21.5" text-anchor="middle" font-family="'Noto Serif SC', 'Songti SC', Georgia, serif" font-weight="600" font-size="16">白</text>
  <circle class="dot" cx="25.5" cy="25.5" r="1.4" />
</svg>
