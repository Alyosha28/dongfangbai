tagline: "Undergraduate researcher in quantitative finance and machine learning. Reading history, studying markets, and building reproducible research systems."
taglineZh: "量化金融与机器学习方向本科研究者。读史、观察市场，并构建可复现的实证研究系统。"
bio:
  - "I am an undergraduate in Big Data Management & Applications at Harbin Institute of Technology (HIT). My research focuses on quantitative factor discovery, neural-guided symbolic search, and empirical asset pricing."
  - "I build full-market equity research pipelines and event-driven macro studies with strict point-in-time data alignment, realistic execution frictions, and automated evaluation harnesses."
  - "Outside research, I read history, observe markets, and write long-form reflections here. Drawn to 「歌未竟，东方白」—and Alba, the quiet light before dawn—as a reminder to stay patient, candid, and perpetually unfinished."
bioZh:
  - "我就读于哈尔滨工业大学（HIT）大数据管理与应用专业。研究聚焦于量化因子发现、神经引导符号搜索与实证资产定价。"
  - "我构建全市场股票多因子研究流水线与事件驱动宏观研究框架，注重严格的时点（Point-in-Time）数据对齐、真实交易摩擦建模与自动化评测框架。"
  - "研究之余，我读史、观察市场，并在这里写一些长文随笔。取题记「歌未竟，东方白」之意，提醒自己保持耐心、坦诚，始终在途。"
