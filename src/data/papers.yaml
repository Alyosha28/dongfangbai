items:
  - id: "continual-execution-feedback"
    title: "Continual Execution Feedback for Neural-Guided Genetic Programming in Stock Factor Discovery"
    authors:
      - "Xianzhuo Huang"
    authorNote: "First Author"
    venue: "Working Paper"
    year: 2026
    status: "Working Paper"
    statusZh: "工作论文"
    featured: true
    tags:
      - "Genetic Programming"
      - "Continual Learning"
      - "Execution Feedback"
      - "Stock Factor Discovery"
    summary: "Studies continual execution feedback in neural-guided genetic programming for formulaic stock factors across 340 fields and 613.6k AST executions (2017–2023), lifting fixed-budget discovery by +133.69 qualified rank representatives over rehearsal-only across 13/13 paired seeds (p = 1.22e-4)."
    summaryZh: "研究神经引导遗传规划在股票公式因子发现中的持续执行反馈机制。在 340 个字段与 61.36 万次 AST 执行（2017–2023）上，联合反馈在 13/13 配对种子中均优于仅重放基线，固定预算下平均多发现 +133.69 个去重有效排序因子（p = 1.22e-4）。"
    abstract: "We study a finite, costly expression-execution search over formulaic stock factors: multiple formulas can produce identical rankings, so each new execution may or may not be novel. The question is whether learning from executed candidates increases discovery capability at a fixed execution budget. A three-member neural ensemble predicts quality, ranking duplication and remaining discovery value; observed executions supervise the ensemble and update bounded field/operator sampling weights. Across six feedback conditions and 13 paired search seeds (development 2017–2019, internal selection 2020, historical evaluation 2021–2023), we assess acquired capability with equal-budget fixed probes. Final joint-replay versus rehearsal-only contrast is positive for every seed: mean difference 133.69 new qualified rank representatives; one-sided finite-seed-population sign-test p = 0.00012207 supports a majority-positive paired effect. Mean final learning gains are joint replay 137.46, neural feedback 114.85, policy feedback 15.46, and joint recent only 144.85. Substantial gains accompany neural learning from new executions; current-only feedback has a higher mean than the tested historical/current mixture."
