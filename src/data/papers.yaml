  - id: "evo-harness"
    title: "EVO-HARNESS: Orthogonalized Research-Harness Evolution for Quantitative Factor Mining"
    authors:
      - "Xianzhuo Huang"
    authorNote: "First Author"
    venue: "Under Review"
    year: 2026
    status: "Under Review"
    statusZh: "在审"
    featured: true
    tags:
      - "LLM Agents"
      - "Evolutionary Search"
      - "Factor Mining"
      - "Orthogonalization"
    summary: "Evolves 12-slot quantitative factor pipelines across 4 generations under a clone-proof deduplicated IC objective (M_dedup) and an eight-arm attribution ladder across 24 Chinese A-share domains and 4 LLMs (n = 192 runs), lifting held-out M_dedup by 70% over Fixed (p_Holm = 0.0002)."
    summaryZh: "提出面向多因子流水线的正交化研究框架进化方法（EVO-HARNESS）：在防克隆去重 IC 目标（M_dedup）与八臂归因阶梯下，跨越 24 个互不相交的 A 股因子域与 4 个大模型（192 次配对实验），将样本外 M_dedup 较固定基线提升 70%（p_Holm = 0.0002）。"
    abstract: "Language-model agents for automated factor mining are typically judged by mean rank correlation (IC) with future stock returns. This score is easily inflated by cloning one strong signal via order-preserving transforms, and it confounds evolutionary feedback with extra tokens, domain priors, and style tilts. We introduce EVO-HARNESS, an evolutionary framework and eight-arm benchmark that evolves a 12-slot factor pipeline across D = 4 generations via mutations, two-seed crossovers, and depth-2 chains under a deduplicated IC (M_dedup) giving clones zero credit. Across 24 disjoint Chinese A-share domains and 4 models (n = 192 runs), pathology-guided evolution (Diagnostic) lifts held-out M_dedup from 0.0152 (Fixed) and 0.0173 (HillClimb) to 0.0259 (p_Holm = 0.0002), while zero-token fingerprint-routed Meta-HillClimb already reaches 0.0215. An exact attribution assigns 73.1% of search-phase gains to structured priors and equal-token sampling (TTS_EqualToken, 0.0253 held out), while slot-level diagnosis adds 21.1% (+0.0009, p_Holm = 0.0038) by eliminating smoothing clones on fundamental domains and pruning high-turnover slots. Leads widen after industry-and-size neutralization (0.0246 vs. 0.0157, p_Holm = 0.0005) and raise monthly break-even cost tolerance to 51.6 bps, though 43-week net Sharpe contrasts remain noisy. In a frozen 2021–2025 replay, structural de-cloning endures across market regimes, whereas the diagnostic edge decays without periodic re-evolution."
    bibtex: |
      @unpublished{huang2026evoharness,
        author = {Huang, Xianzhuo},
        title  = {EVO-HARNESS: Orthogonalized Research-Harness Evolution for Quantitative Factor Mining},
        year   = {2026},
