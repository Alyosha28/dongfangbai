items:
  - id: "continual-execution-feedback"
    title: "Continual Execution Feedback for Neural-Guided Genetic Programming in Stock Factor Discovery"
    authors:
      - "Xianzhuo Huang"
    authorNote: "First Author"
    venue: "Working Paper"
    year: 2026
    status: "Working Paper"
    featured: true
    tags:
      - "Symbolic Regression"
      - "Factor Discovery"
      - "Neural-Guided GP"
      - "CSI 300 / 500 / 1000"
    summary: "Reframes symbolic factor search around deduplicated effective factors per evaluation budget, using a three-head neural ensemble for priority scheduling and parent sampling across 613.6k expression evaluations on CSI 300, CSI 500, and CSI 1000 (2017–2023)."
    abstract: "Symbolic regression for quantitative factor discovery faces two bottlenecks: expensive historical backtesting and heavy collinearity across candidate formulas. We reformulate the search objective around deduplicated effective factors discovered per unit evaluation budget across 340 fields on CSI 300, CSI 500, and CSI 1000 (2017–2023). A three-head neural ensemble—jointly predicting quality, ranking overlap, and exploration value—schedules backtest evaluations and parent selection while updating model and operator priors online from execution feedback. Across 613.6k expression executions and 6x13 paired experiments under cross-period reconstruction, joint online feedback outperforms replay-only baselines in 13/13 runs, lifting qualified representative yield on fixed probes by +42.5% (p = 1.22e-4) and cumulative yield by +20.4%."
    bibtex: |
