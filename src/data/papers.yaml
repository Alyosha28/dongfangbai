  - id: "memory-guided-atomic-evolution"
    title: "Memory-Guided Atomic Evolution of Factor Research Harnesses under Fixed Budgets"
    authors:
      - "Xianzhuo Huang"
    authorNote: "First Author"
    venue: "Working Paper"
    year: 2026
    status: "Working Paper"
    featured: true
    tags:
      - "LLM Agents"
      - "Research Automation"
      - "Factor Discovery"
      - "Fixed Budget"
    summary: "Evolves full factor research harnesses—operator sets, mutation rules, and probe memory—via a Propose–Probe–Compose loop under fixed LLM and evaluation budgets, with strict separation between online exploration and frozen holdout evaluation."
    abstract: "Rather than evolving isolated factor formulas, we treat the factor discovery harness itself—operator sets, mutation rules, and probe memory—as the unit of evolution under fixed LLM and backtest budgets. We build a Propose–Probe–Compose atomic edit loop where online exploration is strictly isolated from the holdout evaluation split, invalid proposals are accounted against the budget, and frozen harnesses are scored on common dates and stock universes (2017–2020 development window). Across 24 paired experiments, memory-guided harness evolution consistently outperforms both fixed initial harnesses (+0.011 mean |IC|, 24/24 wins) and random legal edits in the same search space (+0.0035, p = 0.031), while quantifying the trade-off between faster convergence and factor diversity."
